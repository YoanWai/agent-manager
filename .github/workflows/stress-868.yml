name: stress 868

on:
  push:
    branches: ['stress/pr-868-terminal-echo']

permissions:
  contents: read

jobs:
  terminal:
    name: terminal (${{ matrix.variant }} ${{ matrix.rep }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [main, pr]
        rep: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install psmux
        run: |
          $zip = "$env:RUNNER_TEMP\psmux.zip"
          Invoke-WebRequest https://github.com/psmux/psmux/releases/download/v3.4.0/psmux-v3.4.0-windows-x64.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'a66b6be7c13c6fa0dc3660a267b9e34eaa91a4eb7f07fbd55a0468018bd0f721') {
            throw 'psmux download does not match its release checksum'
          }
          Expand-Archive $zip "$env:RUNNER_TEMP\psmux"
          "$env:RUNNER_TEMP\psmux" >> $env:GITHUB_PATH
      - name: Use the PR test
        if: matrix.variant == 'pr'
        run: git checkout 0d2a7e17 -- internal/sessioncmd/terminal_test.go
      - name: Build tests
        run: go test -count=1 -run '^$' ./...
      - name: Stress
        run: |
          $sessioncmd = 'github.com/YoanWai/agent-manager/internal/sessioncmd'
          $ui = 'github.com/YoanWai/agent-manager/internal/ui'
          $load = go list ./... | Where-Object { $_ -ne $sessioncmd -and $_ -ne $ui }
          $loadJob = Start-Job -ScriptBlock {
            param($dir, $packages)
            Set-Location $dir
            while ($true) { go test -p 2 -count=1 -timeout 60m $packages *> $null }
          } -ArgumentList (Get-Location).Path, $load
          go test -count=30 -timeout 60m -v -run '^TestTerminalsCreateListSendAndReadWithRealTmux$' $sessioncmd *> stress.log
          Stop-Job $loadJob
          $pass = (Select-String -Path stress.log -Pattern '^--- PASS: TestTerminalsCreateListSendAndReadWithRealTmux').Count
          $fail = (Select-String -Path stress.log -Pattern '^--- FAIL: TestTerminalsCreateListSendAndReadWithRealTmux').Count
          "RESULT variant=${{ matrix.variant }} rep=${{ matrix.rep }} pass=$pass fail=$fail"
          "RESULT variant=${{ matrix.variant }} rep=${{ matrix.rep }} pass=$pass fail=$fail" >> $env:GITHUB_STEP_SUMMARY
          Select-String -Path stress.log -Pattern 'terminal never showed' | Select-Object -First 3 | ForEach-Object { $_.Line.Substring(0, [Math]::Min(400, $_.Line.Length)) }
