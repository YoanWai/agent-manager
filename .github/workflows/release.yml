name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Release secrets live in the release environment, which only v* tags can
    # deploy to. Only admins can create v* tags (Release tags ruleset), so a
    # workflow pushed on a branch cannot read them.
    environment: release
    permissions:
      # Creates the release with the workflow token.
      contents: write
      id-token: write
      attestations: write
      # Dispatches badges.yml once the release is out.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        # GITHUB_TOKEN creates the release on this repository. RELEASE_TOKEN
        # pushes only the Homebrew cask to the tap repository.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SCOOP_TOKEN: ${{ secrets.SCOOP_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      # A release created with the workflow token starts no other workflow,
      # so the badges refresh is dispatched here. The release is already out,
      # so a failed dispatch leaves the run green.
      - name: Refresh badges
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run badges.yml --repo "$GITHUB_REPOSITORY"
