name: Badges

on:
  schedule:
    - cron: "17 6 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Render chips
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BADGE_TOKEN: ${{ secrets.BADGE_TOKEN }}
        run: go run ./tools/badges
      - name: Publish generated assets to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f docs/badges/clones.json ]; then
            echo "no fresh clone count, leaving the badges branch as published"
          fi
          git fetch origin refs/heads/badges:refs/remotes/origin/badges
          git checkout -B badges origin/badges
          if [ -f docs/badges/clones.json ]; then
            cp docs/badges/clones.json clones.json
          fi
          if [ -f docs/badges/contributors.png ]; then
            cp docs/badges/contributors.png contributors.png
          else
            echo "no fresh contributor image, leaving the badges branch as published"
          fi
          if [ -z "$(git status --porcelain clones.json contributors.png)" ]; then
            echo "generated assets unchanged"
            exit 0
          fi
          git add clones.json
          if [ -f contributors.png ]; then
            git add contributors.png
          fi
          git commit -m "chore(badges): refresh generated assets"
          git push origin badges
