# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  review_details: true
  poem: true
  review_status: true
  collapse_walkthrough: true
  assess_linked_issues: true
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  finishing_touches:
    docstrings:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: |
        Follow Conventional Commits matching this repo: feat(scope): ...,
        fix(scope): ..., docs: ..., chore: ..., etc. Scope is optional.
        When present it names a package, workflow, or area (ui, tmux, ci,
        mcp, review, and so on). Bare docs:, chore:, test:, and ci: are
        valid. The title is what readers should see in the generated
        changelog.
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks:
      - name: "Tmux socket isolation"
        mode: warning
        instructions: >-
          Fail if changed Go code introduces a tmux invocation that does not
          name a socket. A call is isolated when it goes through the driver
          in internal/tmux (Driver.args pins -L) or when the command line
          includes -L or -S. A bare exec.Command("tmux", ...) or equivalent
          resolves through $TMUX to the developer's live server. Also fail
          if a kill-server, kill-session, global option, or set-hook targets
          a socket this process does not own. Helpers that already pass -L
          or -S need nothing further. Pass when every new or modified tmux
          path is pinned.
      - name: "Sensitive Output Leak Prevention"
        mode: warning
        instructions: >-
          Review new or modified log and output statements (log.*, fmt.Print
          variants, slog). Fail if a message includes passwords, secrets,
          API keys, tokens, or personal data in plaintext. Do not fail
          structured logging or fmt.Sprintf used for non-sensitive values.
          Test fixtures and example files are exempt. Pass when no new
          output can leak credentials or personal data.
      - name: "New Logic Test Adequacy"
        mode: warning
        instructions: >-
          Flag new functions, methods, and bug fixes that lack proportionate
          tests next to the file they cover (listview.go -> listview_test.go).
          Skip trivial changes, generated files, docs, and refactors already
          covered by existing tests. Pass when new behavior has tests for the
          happy path and the error path it introduces.
      - name: "Breaking change disclosure"
        mode: warning
        instructions: >-
          Detect breaking changes to the public CLI (flags, subcommands),
          stored Settings values, documented environment variables, or MCP tool
          names and schemas. Exported identifiers under internal/ are not
          a public API. Fail if a breaking change is present and the PR
          description has no Breaking Changes section that names each
          change. Pass when there is no breaking change, or each one is
          documented.
      - name: "Visual evidence"
        mode: warning
        instructions: >-
          Check the PR description's Visual evidence section. For a change
          that can be shown visually, fail when before and after screenshots
          are missing. Accept a short recording instead when it demonstrates
          interaction or motion more clearly. If one state cannot be captured,
          accept the available evidence with an explicit explanation. For a
          change with no meaningful visual state, accept an explicit reason
          that visual evidence is not applicable. Fail when the description
          provides neither useful visual evidence nor an explanation.
      - name: "Scope fidelity"
        mode: warning
        instructions: >-
          Read the Scope section of the PR description: Required behavior
          and Why this approach. Fail when the diff adds user-visible
          behavior, public CLI, config or MCP surface, unrelated refactoring,
          or new persisted state that neither asks for. Return Inconclusive
          when the section is absent or too thin to judge; never infer a
          requirement that no human wrote down.
      - name: "Tool and platform coverage"
        mode: warning
        instructions: >-
          Evaluate tool coverage and platform/terminal coverage independently.
          Pass overall only when both pass. A failure on either fails the
          check. Otherwise return Inconclusive when evidence is insufficient.
          For tool coverage, apply REVIEW.md#tool-coverage. New shared behavior
          must reach every applicable tool in builtinTools
          (internal/config/config.go) in the same PR. An unchanged fallback
          is not coverage of the new behavior. Naming exclusions or promising
          follow-ups does not pass tool coverage. A fix confined to a
          demonstrated tool-specific defect, support for a new CLI, or a change
          with no tool-dependent behavior passes tool coverage when unrelated
          tools are unaffected. Other partial features pass tool coverage only
          with evidence for exclusions, why the feature belongs in the manager,
          consideration of a shared alternative, maintenance cost, unsupported
          behavior, and an explicit maintainer decision accepting the exception.
          Accept that decision in a maintainer's own PR description or an issue
          comment, PR comment, or review linked from Scope. Verify who made it.
          A contributor's claim of approval or automated approval does not count.
          Fail confirmed missing applicable tool coverage without an accepted
          exception. Return Inconclusive if applicability or claimed approval
          cannot be verified. Contributors unable or unwilling to cover other
          applicable tools must open an issue first. They may link a draft PR
          marked as a reference implementation with its missing coverage.
          Treat a reference draft as a proposal, not a merge candidate. It stays
          in draft until coverage is complete or an exception is accepted.
          For platform/terminal coverage, check every platform .goreleaser.yaml
          builds plus WSL2 (internal/wsl), and every terminal locally or over
          SSH on tmux 3.1 and later. Check runtime.GOOS branches, platform-only
          commands and paths, Linux assumptions about desktops absent in WSL2,
          terminal features dependent on TERM_PROGRAM, TERM, or SSH_CONNECTION,
          and tmux features requiring a newer version without a fallback.
          Documented platform/terminal exclusions and what support would take
          pass only the platform/terminal portion, leaving that decision to
          the maintainer. They never excuse missing tool coverage.
      - name: "Input and configuration surface"
        mode: warning
        instructions: >-
          Fail when the diff adds a UI action, row, panel, or handle that
          works by keyboard only or by mouse only; each new action has both,
          and the footer or key map names the key. Fail when the diff adds a
          user-facing setting that is read from a hand-edited file or an
          environment variable instead of a Settings row the manager stores. Fail when the diff adds a list of
          values an upstream release can change (model names, thinking
          modes, capabilities, prompts) instead of discovering them at
          runtime. Pass when the change touches none of these surfaces.
      - name: "No speculative fallbacks"
        mode: warning
        instructions: >-
          Fail if changed code adds a fallback, nil-guard, or dual-path for
          a shape that cannot occur in this repository (an imagined field,
          format, or error). Guards on genuinely external or untrusted input
          are correct. Silent fallbacks that mask a real failure are a
          defect. Pass when every new branch is justified by a reachable
          case.
  path_filters:
    - "!**/*.gif"
    - "!**/*.png"
  path_instructions:
    - path: "**/*.go"
      instructions: |
        Comments are rare and explain a non-obvious why, never what the code
        does. Do not ask for doc comments, JSDoc-style blocks, or "what" comments
        on exported identifiers.
        Reject speculative branches: a fallback or nil-guard for a shape that
        cannot occur is a defect, not safety. Guards on genuinely external or
        untrusted input are correct.
        Errors propagate or are handled explicitly; silent fallbacks that mask a
        failure are a defect.
        Every tmux invocation names its socket, either by going through the
        driver in internal/tmux or by passing -L or -S. A bare exec.Command
        ("tmux", ...) resolves through $TMUX to the developer's own live server,
        so flag one as critical, and treat a global option, kill-session or
        set-hook on an unpinned socket as data loss.
        Names spell out intent. One-letter method receivers and the usual short
        Go names (i and j for indices, r and w for readers and writers, ctx, err)
        are idiomatic here and are never worth a comment; flag only a name whose
        meaning a reader cannot recover, or an invented abbreviation.
        Do not comment on formatting, import order, or style that gofmt already
        owns.
    - path: "**/*_test.go"
      instructions: |
        Tests live beside the file they cover (listview.go -> listview_test.go).
        The suite drives a real tmux server, so it runs as
        env -u TMUX TMUX_TMPDIR=/tmp/<short> go test ./..., and the socket dir
        must keep TMUX_TMPDIR/tmux-<uid>/default under 104 characters or tmux
        falls back to the default socket. A helper that already passes -L or -S
        pins its own socket and needs nothing further. Flag a kill-server or
        kill-session that is not pinned to an isolated socket as critical.
    - path: "internal/tmux/**"
      instructions: |
        This package owns the dedicated agentmgr socket, and Driver.args is what
        pins it. Flag an exec path that bypasses that helper, and any global
        option or key binding written to a server this process does not own.
    - path: "internal/ui/**"
      instructions: |
        Bubble Tea: one Model, files grouped by feature. Update must not block;
        flag synchronous I/O, exec, or sleeps on the update path instead of a
        tea.Cmd.
    - path: "internal/config/**"
      instructions: |
        builtinTools is the only source of tool definitions and loads on every
        start, so an edited tool pattern or command reaches every install on
        that release and needs no migration. A config.toml from an earlier
        release is read once, by the import in internal/store, for its
        editor and key tables. Flag any other read or write of that file. A
        default belongs in code.
    - path: "internal/store/**"
      instructions: |
        The migrations slice is append-only. Editing or reordering an existing
        entry is a defect: the loop swallows "duplicate column", so a changed
        column default silently reaches fresh installs only and upgraded
        databases keep the old one. New schema arrives as a new entry at the end,
        written so re-running it on an already-migrated database is harmless.
    - path: "internal/update/**"
      instructions: |
        This package replaces the running binary. The downloaded asset is
        checksum-verified before anything is renamed over the executable, so
        flag a path that skips or weakens that check, follows a redirect to
        another host, widens the permissions of the staged file, or writes
        outside the staging directory.
    - path: ".github/workflows/**"
      instructions: |
        Actions are pinned to a release tag and bumped by dependabot, so a tag
        pin is correct and needs no comment. Flag a mutable ref (a branch such
        as @main, or no ref at all), and any workflow that exposes secrets to
        pull_request_target or to a step running untrusted PR code.

code_generation:
  unit_tests:
    path_instructions:
      - path: "**/*_test.go"
        instructions: |
          Never call tmux without naming a socket: go through the driver in
          internal/tmux, or pass -L or -S. A bare tmux call resolves through
          $TMUX to the developer's live server and can tear down their running
          sessions. Never emit kill-server, and place the test beside the file
          it covers.

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  automatic_repository_linking: true
  code_guidelines:
    enabled: true
    filePatterns:
      - files: "PRODUCT.md"
        applyTo: "**/*"
      - files: "REVIEW.md"
        applyTo: "**/*"
      - files: "DESIGN.md"
        applyTo: "internal/ui/**"
