version: 2

project_name: agent-manager

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # naming files replaces goreleaser's defaults, so LICENSE and README repeat here
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  header: |
    Run every AI coding agent from one terminal. Claude Code, Codex, OpenCode, Grok, Gemini CLI, and Pi run side by side, each in its own tmux session, with live status, a project tree, quick prompts, and full-file diff review. Runs on macOS and Linux, and on Windows inside WSL2. [See it running](https://github.com/YoanWai/agent-manager#agent-manager).

  footer: |
    ## Install

    ```bash
    # macOS / Linux
    brew install yoanwai/tap/agent-manager
    curl -fsSL https://raw.githubusercontent.com/YoanWai/agent-manager/main/install.sh | sh
    mise use -g ubi:YoanWai/agent-manager
    go install github.com/YoanWai/agent-manager@latest

    # Arch Linux
    yay -S agent-manager-bin
    ```

    Prebuilt macOS and Linux binaries are attached below. Windows runs it inside WSL2.

    ## Get involved

    [Discussions](https://github.com/YoanWai/agent-manager/discussions) for questions and setups, [issues](https://github.com/YoanWai/agent-manager/issues) for bugs and ideas, [CONTRIBUTING.md](https://github.com/YoanWai/agent-manager/blob/main/.github/CONTRIBUTING.md) to send a patch.

homebrew_casks:
  - repository:
      owner: YoanWai
      name: homebrew-tap
    homepage: https://github.com/YoanWai/agent-manager
    description: Terminal UI to manage AI coding-agent tmux sessions
    license: Apache-2.0
    binaries:
      - agent-manager
    dependencies:
      - formula: tmux
    # Casks quarantine what they download and Gatekeeper blocks an unsigned
    # binary outright. The OS.mac? guard keeps Linux installs working, where
    # system_command on a missing /usr/bin/xattr aborts the install.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/agent-manager"]
          end

# git_url resolves to an empty string without AUR_KEY in the environment, and
# goreleaser skips the publish on an empty url, so a release without the key
# still succeeds.
aurs:
  - name: agent-manager-bin
    homepage: https://github.com/YoanWai/agent-manager
    description: Terminal UI to manage AI coding-agent tmux sessions
    license: Apache-2.0
    maintainers:
      - Yoan Wai <106609173+YoanWai@users.noreply.github.com>
    depends:
      - tmux
      - git
    provides:
      - agent-manager
    conflicts:
      - agent-manager
    private_key: '{{ index .Env "AUR_KEY" }}'
    git_url: '{{ if index .Env "AUR_KEY" }}ssh://aur@aur.archlinux.org/agent-manager-bin.git{{ end }}'
    package: |-
      install -Dm755 "./agent-manager" "${pkgdir}/usr/bin/agent-manager"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/agent-manager-bin/LICENSE"
      install -Dm644 "./NOTICE" "${pkgdir}/usr/share/licenses/agent-manager-bin/NOTICE"
