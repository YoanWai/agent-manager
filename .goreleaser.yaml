version: 2

project_name: agent-manager

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    # naming files replaces goreleaser's defaults, so LICENSE and README repeat here
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt
  # Hashed in place. The attestation step reads these digests from
  # checksums.txt; it does not open the files. A before-hook copy into dist
  # fails the release: dist must be empty when the dist pipe runs.
  extra_files:
    - glob: ./install.ps1
    - glob: ./install.sh

changelog:
  use: github-native

release:
  # Same bytes checksum.extra_files hashes, so the asset digest matches the attestation.
  extra_files:
    - glob: ./install.ps1
    - glob: ./install.sh
  header: |
    Run every AI coding agent from one terminal. Claude Code, Codex, OpenCode, Grok Build, Gemini CLI, Antigravity CLI, Pi, Command Code, Hermes Agent, Muse Code, Oh My Pi, and Cursor CLI run side by side, each in its own tmux session, with live status, a project tree, quick prompt mode, and full-file diff review. Runs on macOS, Linux and Windows (with psmux), and inside WSL2. [See it running](https://github.com/YoanWai/agent-manager#agent-manager).

  footer: |
    ## Install

    ```bash
    # macOS / Linux
    brew install agent-manager
    curl -fsSL -o install.sh https://github.com/YoanWai/agent-manager/releases/latest/download/install.sh && sh install.sh
    mise use -g ubi:YoanWai/agent-manager
    go install github.com/YoanWai/agent-manager@latest

    # Arch Linux
    yay -S agent-manager-bin
    ```

    ```powershell
    # Windows. The Scoop bucket can lag this release.
    scoop bucket add yoanwai https://github.com/YoanWai/scoop-bucket
    scoop install yoanwai/agent-manager

    # Download install.ps1 (attached below, listed in checksums.txt), read it,
    # then run it. Windows PowerShell 5.1 has no &&.
    irm https://github.com/YoanWai/agent-manager/releases/latest/download/install.ps1 -OutFile install.ps1
    if ($?) {
      Get-Content .\install.ps1
      Unblock-File .\install.ps1
      powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
    }
    ```

    `install.sh` is attached too. `gh attestation verify <file> --repo YoanWai/agent-manager` checks build provenance once `gh` is logged in.

    The shell short form runs the script without a local copy: `curl -fsSL https://raw.githubusercontent.com/YoanWai/agent-manager/main/install.sh | sh`.

    Prebuilt macOS, Linux and Windows binaries are attached below.

    ## Get involved

    [Discussions](https://github.com/YoanWai/agent-manager/discussions) for questions and setups, [issues](https://github.com/YoanWai/agent-manager/issues) for bugs and ideas, [CONTRIBUTING.md](https://github.com/YoanWai/agent-manager/blob/main/.github/CONTRIBUTING.md) to send a patch.

homebrew_casks:
  - repository:
      owner: YoanWai
      name: homebrew-tap
    homepage: https://agent-manager.dev/
    description: Run Claude Code, Codex, OpenCode and other AI coding agents in tmux
    license: Apache-2.0
    binaries:
      - agent-manager
    dependencies:
      - formula: tmux
    # Strips Gatekeeper quarantine from the download. goreleaser renders hooks
    # as the deprecated `postflight` block, so the declarative stanza goes
    # through custom_block; the doubled braces survive its template pass.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/agent-manager"]
        end
      end

# Own Scoop bucket. Skipped when SCOOP_TOKEN is unset so releases still succeed.
scoops:
  - name: agent-manager
    repository:
      owner: YoanWai
      name: scoop-bucket
      token: "{{ .Env.SCOOP_TOKEN }}"
    skip_upload: '{{ if index .Env "SCOOP_TOKEN" }}false{{ else }}true{{ end }}'
    directory: bucket
    homepage: https://agent-manager.dev/
    description: Run Claude Code, Codex, OpenCode and other AI coding agents in tmux
    license: Apache-2.0
    depends: ["main/psmux"]
    commit_author:
      name: Yoan Wai
      email: 106609173+YoanWai@users.noreply.github.com

# git_url resolves to an empty string without AUR_KEY in the environment, and
# goreleaser skips the publish on an empty url, so a release without the key
# still succeeds.
aurs:
  - name: agent-manager-bin
    homepage: https://agent-manager.dev/
    description: Run Claude Code, Codex, OpenCode and other AI coding agents in tmux
    license: Apache-2.0
    maintainers:
      - Yoan Wai <106609173+YoanWai@users.noreply.github.com>
    depends:
      - tmux
      - git
    provides:
      - agent-manager
    conflicts:
      - agent-manager
    private_key: '{{ index .Env "AUR_KEY" }}'
    git_url: '{{ if index .Env "AUR_KEY" }}ssh://aur@aur.archlinux.org/agent-manager-bin.git{{ end }}'
    package: |-
      install -Dm755 "./agent-manager" "${pkgdir}/usr/bin/agent-manager"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/agent-manager-bin/LICENSE"
      install -Dm644 "./NOTICE" "${pkgdir}/usr/share/licenses/agent-manager-bin/NOTICE"

# Opens a PR to microsoft/winget-pkgs from YoanWai/winget-pkgs (fork).
# Skipped when WINGET_TOKEN is unset, so a release without the secret still succeeds.
winget:
  - name: AgentManager
    publisher: YoanWai
    package_identifier: YoanWai.AgentManager
    short_description: Run Claude Code, Codex, OpenCode and other AI coding agents in tmux
    description: Run every AI coding agent from one terminal, each in its own tmux/psmux session, with live status, quick prompts, worktrees and diff review. On Windows it needs psmux, which winget installs as marlocarlo.psmux.
    homepage: https://agent-manager.dev/
    publisher_url: https://github.com/YoanWai
    license: Apache-2.0
    license_url: https://github.com/YoanWai/agent-manager/blob/main/LICENSE
    release_notes_url: "https://github.com/YoanWai/agent-manager/releases/tag/v{{ .Version }}"
    tags: [ai, agents, tmux, tui, cli, claude-code, codex]
    commit_author:
      name: Yoan Wai
      email: 106609173+YoanWai@users.noreply.github.com
    # git is optional at startup (a missing git is ignored). PowerShell 7 is
    # required only when a pane is created, and install.ps1 offers it instead
    # of refusing to install, so neither is a package dependency. psmux is the
    # multiplexer the Windows build drives, and 3.4.0 is the oldest it accepts.
    dependencies:
      - package_identifier: marlocarlo.psmux
        minimum_version: "3.4.0"
    skip_upload: '{{ if index .Env "WINGET_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: YoanWai
      name: winget-pkgs
      branch: "agent-manager-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
